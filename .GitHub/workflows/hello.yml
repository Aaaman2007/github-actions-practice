# workflow

name: hello

# on tells when the workflow should run
on:
  workflow_dispatch: 

# job twlls what the workflow do, there should be one or onemore jobs, hence we write jobs
# jobs are object so need indentation
jobs:
#1st job (give indentation)
  say-hello: 
  # creates an emphemeral containe ubuntu-running
    runs-on: ubuntu-latest
    steps:
      - name: say hello to everyone
        run: "hello dosto"

